name: Python Project Checks

on:
  push:
    branches: ["main", "portfolio/reliability-docs"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python source
        run: python -m py_compile detector.py
